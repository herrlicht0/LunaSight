<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaSight: Artemis III HUD & Landing Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/lunasight-core.js"></script>
    <style>
        .helmet-visor {
            position: fixed; inset: 0;
            border: 40px solid black;
            border-radius: 50px;
            box-shadow: inset 0 0 100px rgba(0, 242, 254, 0.15);
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 768px) { .helmet-visor { border-width: 10px; border-radius: 24px; } }
        .panorama-container {
            position: absolute; inset: 0;
            background-repeat: repeat-x;
            background-color: #000;
            cursor: grab;
            transition: filter 0.6s ease;
            z-index: 1;
            touch-action: none;
        }
        .panorama-container:active { cursor: grabbing; }
        .hud-panel {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }
        .sky-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
        .marker { position: absolute; transform: translate(-50%, -50%); transition: opacity 0.4s ease; }
        .marker-label { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 6px; white-space: nowrap; font-size: 10px; letter-spacing: 0.12em; }
        body { overflow: hidden; margin: 0; }
    </style>
</head>
<body class="bg-black text-white font-mono select-none">

    <div id="panorama" class="panorama-container" role="img" aria-label="Lunar surface panorama. Drag or use the left and right arrow keys to look around." tabindex="0"></div>

    <div class="sky-layer" aria-hidden="true">
        <div id="earthshineTint" class="absolute inset-0 bg-blue-900 mix-blend-multiply transition-opacity duration-500" style="opacity:0"></div>
        <div id="sunGlare" class="absolute inset-0 transition-opacity duration-500" style="opacity:0"></div>
        <svg id="terrainMask" class="absolute inset-0 w-full h-full">
            <polyline id="terrainLine" fill="none" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" stroke-dasharray="6 5"></polyline>
            <line id="idealHorizon" x1="0" x2="100%" stroke="rgba(255,255,255,0.18)" stroke-width="1"></line>
        </svg>
        <div id="sunMarker" class="marker">
            <div id="sunDisc" class="w-7 h-7 rounded-full bg-amber-200" style="box-shadow:0 0 30px 12px rgba(253,230,138,0.55)"></div>
            <span id="sunLabel" class="marker-label text-amber-300">SUN</span>
        </div>
        <div id="earthMarker" class="marker">
            <div id="earthDisc" class="w-6 h-6 rounded-full border border-sky-300" style="background:radial-gradient(circle at 35% 35%, #7dd3fc, #1d4ed8 70%); box-shadow:0 0 14px 4px rgba(56,189,248,0.45)"></div>
            <span id="earthLabel" class="marker-label text-sky-300">EARTH</span>
        </div>
        <div class="absolute top-4 md:top-14 left-1/2 -translate-x-1/2 text-[10px] tracking-[0.2em] text-cyan-300/80 bg-black/40 px-3 py-1 rounded">
            <span id="compassTxt">HDG 000°</span> · ELEV ×3
        </div>
    </div>

    <div class="helmet-visor"></div>

    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col md:flex-row md:items-start md:justify-between gap-4 p-4 md:p-12 pb-44 overflow-y-auto">

        <section aria-labelledby="plannerTitle" class="pointer-events-auto w-full md:w-80 p-6 rounded-xl hud-panel space-y-4">
            <h2 id="plannerTitle" class="text-cyan-400 font-bold text-lg tracking-widest border-b border-cyan-500/30 pb-2">📂 MISSION PLANNER</h2>
            <div>
                <label for="siteSelect" class="text-xs text-gray-400">SELECT SITE</label>
                <select id="siteSelect" class="w-full bg-slate-900 border border-cyan-500/40 p-2 rounded mt-1 text-sm text-cyan-300 focus:outline-none focus:border-cyan-300" onchange="handleSiteChange()">
                    <option value="slater">Slater Plain (Oasis)</option>
                    <option value="malapert">Malapert Massif (Communications Peak)</option>
                    <option value="nobile">Nobile Rim (Crater Edge)</option>
                    <option value="shackleton">🚨 BONUS: Shackleton Crater (Danger Zone)</option>
                    <option value="custom" hidden>Custom coordinates</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="latInput" class="text-xs text-gray-400">LATITUDE</label>
                    <input type="number" id="latInput" value="-88.08" step="0.01" min="-90" max="90" class="w-full bg-slate-900 border border-cyan-500/40 p-2 rounded mt-1 text-sm text-center">
                </div>
                <div>
                    <label for="lngInput" class="text-xs text-gray-400">LONGITUDE (E+)</label>
                    <input type="number" id="lngInput" value="111.29" step="0.01" min="-180" max="360" class="w-full bg-slate-900 border border-cyan-500/40 p-2 rounded mt-1 text-sm text-center">
                </div>
            </div>
            <button onclick="calculateCustomCoordinates()" class="w-full bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-black font-bold py-2 rounded text-xs tracking-wider transition">
                CHECK COORDINATES
            </button>
            <div>
                <label for="epochInput" class="text-xs text-gray-400">MISSION EPOCH (UTC)</label>
                <input type="datetime-local" id="epochInput" value="2027-01-15T12:00" class="w-full bg-slate-900 border border-cyan-500/40 p-2 rounded mt-1 text-sm text-cyan-300 [color-scheme:dark]" onchange="updateTimelineValues()">
            </div>
            <div>
                <label for="profileSelect" class="text-xs text-gray-400">DSN UPLINK PROFILE</label>
                <select id="profileSelect" class="w-full bg-slate-900 border border-cyan-500/40 p-2 rounded mt-1 text-xs text-cyan-300 focus:outline-none" onchange="updateTimelineValues()"></select>
            </div>
            <div class="border-t border-cyan-500/20 pt-3">
                <div class="flex justify-between items-center">
                    <label for="timeSlider" class="text-xs text-gray-400">MISSION TIMELINE</label>
                    <select id="spanSelect" aria-label="Timeline span" class="bg-slate-900 border border-cyan-500/30 rounded text-[10px] text-amber-300 px-1 py-0.5" onchange="changeSpan()">
                        <option value="24">24 H</option>
                        <option value="708">LUNAR DAY</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2 mt-1">
                    <button id="playBtn" onclick="toggleTimeline()" class="bg-amber-500 text-black px-3 py-1 rounded text-xs font-bold">PLAY</button>
                    <input type="range" id="timeSlider" min="0" max="24" step="0.5" value="12" class="w-full accent-amber-500" oninput="updateTimelineValues()">
                </div>
                <p id="timeTxt" class="text-[10px] text-amber-300/90 mt-1">T+12.0 h</p>
            </div>
            <div class="flex justify-between items-center border-t border-cyan-500/20 pt-3 text-xs">
                <span class="text-gray-400">COMMS CHANNEL</span>
                <button id="audioBtn" onclick="toggleAudio()" aria-pressed="false" class="bg-red-500 text-white px-2 py-1 rounded font-bold">OFF</button>
            </div>
            <p id="audioStatus" class="text-[10px] text-cyan-300/70 -mt-2" aria-live="polite"></p>
            <div class="border-t border-cyan-500/20 pt-3 space-y-1">
                <label for="jplFile" class="text-xs text-gray-400 block">JPL HORIZONS DATA (main.py --out)</label>
                <input type="file" id="jplFile" accept="application/json,.json" class="w-full text-[10px] text-gray-400 file:mr-2 file:rounded file:border-0 file:bg-slate-700 file:px-2 file:py-1 file:text-cyan-300" onchange="loadJplFile(event)">
                <p id="sourceTxt" class="text-[10px] text-cyan-300/70">SOURCE: ANALYTIC EPHEMERIS MODEL</p>
            </div>
        </section>

        <section aria-labelledby="telemetryTitle" class="pointer-events-auto w-full md:w-80 p-6 rounded-xl hud-panel space-y-5">
            <h2 id="telemetryTitle" class="text-cyan-400 font-bold text-lg tracking-widest border-b border-cyan-500/30 pb-2">📊 TELEMETRY</h2>
            <div class="space-y-1">
                <div class="flex justify-between text-xs">
                    <span class="text-amber-400">SOLAR ENERGY POTENTIAL · 24H</span>
                    <span id="solarTxt" class="font-bold text-amber-300">—</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-amber-500/20" role="progressbar" aria-labelledby="solarTxt" aria-valuemin="0" aria-valuemax="100" id="solarBarWrap">
                    <div id="solarBar" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%;"></div>
                </div>
                <p id="solarDetail" class="text-[10px] text-gray-400 leading-relaxed">—</p>
            </div>
            <div class="space-y-1">
                <div class="flex justify-between text-xs">
                    <span class="text-emerald-400">DIRECT-TO-EARTH COMMS</span>
                    <span id="commsTxt" class="font-bold text-emerald-300">—</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-emerald-500/20" role="progressbar" aria-labelledby="commsTxt" aria-valuemin="0" aria-valuemax="100" id="commsBarWrap">
                    <div id="commsBar" class="bg-emerald-400 h-full transition-all duration-300" style="width: 0%;"></div>
                </div>
                <p id="commsDetail" class="text-[10px] text-gray-400 leading-relaxed">—</p>
            </div>
            <dl class="grid grid-cols-3 gap-2 text-center border-t border-cyan-500/20 pt-3">
                <div><dt class="text-[9px] text-gray-400">SUN 24H</dt><dd id="fracSun" class="text-sm text-amber-300 font-bold">—</dd></div>
                <div><dt class="text-[9px] text-gray-400">EARTH 24H</dt><dd id="fracEarth" class="text-sm text-sky-300 font-bold">—</dd></div>
                <div><dt class="text-[9px] text-gray-400">BOTH 24H</dt><dd id="fracBoth" class="text-sm text-emerald-300 font-bold">—</dd></div>
            </dl>
            <div class="border-t border-cyan-500/20 pt-4 text-center space-y-2">
                <span class="text-xs text-gray-400 tracking-widest block">MISSION APPROVAL INDEX</span>
                <div id="statusBadge" class="inline-block px-4 py-2 rounded font-bold text-sm tracking-widest border bg-emerald-950/80 border-emerald-500 text-emerald-400">—</div>
                <p id="assessLabel" class="text-[10px] text-cyan-300 tracking-widest">—</p>
                <p id="assessNote" class="text-[10px] text-gray-400 leading-relaxed text-left">—</p>
            </div>
        </section>
    </div>

    <div class="absolute bottom-6 md:bottom-12 left-1/2 -translate-x-1/2 w-[92%] md:w-[60%] p-4 rounded-xl hud-panel z-20 text-center border-orange-500/30">
        <span class="text-xs text-orange-400 tracking-widest font-bold block mb-1">📡 ASTRONAUT COMMS LOG</span>
        <p id="subtitleTxt" aria-live="polite" class="text-sm text-gray-200 transition-all duration-300">Systems online.</p>
    </div>

    <script>
        const LS = window.LunaSight;
        const rad = (d) => d * LS.DEG;

        /* Terrain horizon masks (degrees above ideal horizon vs. azimuth). Illustrative stand-ins
           for the LOLA masks the desktop app computed; replace with real LOLA profiles when available. */
        const fixedSites = {
            slater:     { lat: -88.08, lng: 111.29, name: "Slater Plain",     img: "./images/panorama-slater.png",
                          horizon: (az) => 0.25 + 0.35 * Math.sin(rad(2 * az + 40)) + 0.2 * Math.cos(rad(az - 210)) },
            malapert:   { lat: -85.90, lng: 0.00,   name: "Malapert Massif",  img: "./images/panorama-malapert.png",
                          horizon: (az) => -1.6 + 0.4 * Math.cos(rad(az - 180)) + 0.25 * Math.sin(rad(3 * az)) },
            nobile:     { lat: -85.27, lng: 53.28,  name: "Nobile Rim",       img: "./images/panorama-nobile.png",
                          horizon: (az) => 0.3 + 2.6 * Math.max(0, Math.cos(rad(az - 305))) ** 2 + 0.3 * Math.sin(rad(3 * az + 10)) },
            shackleton: { lat: -89.67, lng: 129.78, name: "Shackleton Crater", img: "./images/panorama-shackleton.png",
                          horizon: (az) => 17 + 1.5 * Math.sin(rad(2 * az)) },
        };
        const FLAT_HORIZON = () => 0;
        const EARTH_ANGULAR_RADIUS_DEG = 0.95;
        const REFERENCE_SENSITIVITY_DBM = -120;
        const SIGNAL_DISPLAY_RANGE_DB = 40;
        const FOV_DEG = 100;
        const ELEVATION_EXAGGERATION = 3;

        const state = {
            siteKey: "slater",
            custom: null,
            heading: 300,
            jpl: null,
            lastSpokenKey: "",
            lastResult: null,
        };

        const $ = (id) => document.getElementById(id);
        const panorama = $("panorama");

        const profileSelect = $("profileSelect");
        for (const p of Object.values(LS.DSN_PROFILES)) {
            const opt = document.createElement("option");
            opt.value = p.key;
            opt.textContent = `${p.label} · ${p.eirpDbw} dBW`;
            profileSelect.appendChild(opt);
        }

        /* ---------- Look-around (drag / arrows) ---------- */
        const pxPerDeg = () => window.innerWidth / FOV_DEG;
        let isDragging = false, lastX = 0;
        panorama.addEventListener("pointerdown", (e) => { isDragging = true; lastX = e.clientX; panorama.setPointerCapture(e.pointerId); });
        panorama.addEventListener("pointerup", () => (isDragging = false));
        panorama.addEventListener("pointercancel", () => (isDragging = false));
        panorama.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            state.heading = LS.norm360(state.heading - (e.clientX - lastX) / pxPerDeg());
            lastX = e.clientX;
            renderView();
        });
        window.addEventListener("keydown", (e) => {
            if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
                state.heading = LS.norm360(state.heading + (e.key === "ArrowLeft" ? -5 : 5));
                renderView();
            }
        });
        window.addEventListener("resize", () => renderView());

        /* ---------- Radio audio engine: MP3 tracks crossfaded by computed link quality ---------- */
        const AUDIO_TRACKS = {
            telsiz: "./audio/telsiz.mp3",
            cizirti: "./audio/cizirti.mp3",
            music: "./audio/background-music.mp3",
        };
        const MIX = { telsizMax: 0.9, cizirtiMax: 0.8, cizirtiFloor: 0.05, musicLevel: 0.18, musicNoLos: 0.08 };

        const Radio = {
            ctx: null, tracks: {}, telsizGain: null, cizirtiGain: null, musicGain: null, crackleGain: null,
            telsizFilter: null, crackleTimer: null, quality: 0,
            init() {
                if (this.ctx) return;
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.ctx = ctx;
                const makeTrack = (key) => {
                    const el = new Audio(AUDIO_TRACKS[key]);
                    el.loop = true;
                    el.preload = "auto";
                    el.addEventListener("error", () => { $("audioStatus").innerText = `Missing ${AUDIO_TRACKS[key]}`; });
                    this.tracks[key] = el;
                    return ctx.createMediaElementSource(el);
                };

                this.telsizGain = ctx.createGain(); this.telsizGain.gain.value = 0;
                this.telsizFilter = ctx.createBiquadFilter();
                this.telsizFilter.type = "bandpass"; this.telsizFilter.frequency.value = 1700; this.telsizFilter.Q.value = 0.6;
                makeTrack("telsiz").connect(this.telsizFilter).connect(this.telsizGain).connect(ctx.destination);

                this.cizirtiGain = ctx.createGain(); this.cizirtiGain.gain.value = 0;
                this.crackleGain = ctx.createGain(); this.crackleGain.gain.value = 1;
                makeTrack("cizirti").connect(this.crackleGain).connect(this.cizirtiGain).connect(ctx.destination);

                this.musicGain = ctx.createGain(); this.musicGain.gain.value = 0;
                makeTrack("music").connect(this.musicGain).connect(ctx.destination);

                this.crackleTimer = setInterval(() => {
                    const burst = Math.random() < (1 - this.quality) * 0.5 ? 1 + Math.random() * 1.2 : 1;
                    this.crackleGain.gain.setTargetAtTime(burst, ctx.currentTime, 0.02);
                }, 90);
            },
            play() {
                Object.values(this.tracks).forEach((el) => el.play().catch(() => {}));
            },
            pause() {
                Object.values(this.tracks).forEach((el) => el.pause());
            },
            setSignal(quality) {
                this.quality = quality;
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const on = audioEnabled ? 1 : 0;
                const telsiz = on * MIX.telsizMax * Math.sin((quality * Math.PI) / 2);
                const cizirti = on * MIX.cizirtiMax * Math.max(Math.cos((quality * Math.PI) / 2), MIX.cizirtiFloor);
                this.telsizGain.gain.setTargetAtTime(telsiz, t, 0.25);
                this.cizirtiGain.gain.setTargetAtTime(cizirti, t, 0.25);
                this.musicGain.gain.setTargetAtTime(on * (quality > 0 ? MIX.musicLevel : MIX.musicNoLos), t, 0.6);
                this.telsizFilter.Q.value = 0.6 + (1 - quality) * 3;
                $("audioStatus").innerText = audioEnabled
                    ? `RADIO ${Math.round(telsiz / MIX.telsizMax * 100)}% · STATIC ${Math.round(cizirti / MIX.cizirtiMax * 100)}%`
                    : "";
            },
            quindar(freq) {
                if (!this.ctx || !audioEnabled) return;
                const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
                osc.frequency.value = freq; g.gain.value = 0.08 * Math.max(this.quality, 0.15);
                osc.connect(g).connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            },
            speak(text) {
                if (!audioEnabled || !("speechSynthesis" in window) || this.quality < 0.05) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "en-US"; u.rate = 1.05; u.pitch = 0.9; u.volume = Math.min(1, this.quality);
                u.onstart = () => this.quindar(2525);
                u.onend = () => this.quindar(2475);
                speechSynthesis.speak(u);
            },
            stop() {
                if ("speechSynthesis" in window) speechSynthesis.cancel();
                this.setSignal(this.quality);
            },
        };

        let audioEnabled = false;
        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = $("audioBtn");
            btn.setAttribute("aria-pressed", String(audioEnabled));
            if (audioEnabled) {
                btn.innerText = "ON";
                btn.className = "bg-emerald-500 text-white px-2 py-1 rounded font-bold";
                Radio.init();
                Radio.ctx.resume();
                Radio.play();
                state.lastSpokenKey = "";
                updateSimulation();
            } else {
                btn.innerText = "OFF";
                btn.className = "bg-red-500 text-white px-2 py-1 rounded font-bold";
                Radio.stop();
                Radio.pause();
            }
        }

        function adjustAudioMixing(signalQuality) {
            Radio.setSignal(signalQuality);
        }

        /* ---------- Site selection ---------- */
        function angularDistanceDeg(lat1, lon1, lat2, lon2) {
            const c = Math.sin(rad(lat1)) * Math.sin(rad(lat2)) + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.cos(rad(lon1 - lon2));
            return Math.acos(LS.clamp(c, -1, 1)) / LS.DEG;
        }

        function calculateCustomCoordinates() {
            const lat = parseFloat($("latInput").value);
            const lng = parseFloat($("lngInput").value);
            if (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lng) || lng < -180 || lng > 360) {
                $("subtitleTxt").innerText = "Latitude must be −90 to +90 and longitude −180 to +360 degrees.";
                return;
            }
            let closestSite = "slater", minDistance = Infinity;
            for (const key in fixedSites) {
                const d = angularDistanceDeg(lat, lng, fixedSites[key].lat, fixedSites[key].lng);
                if (d < minDistance) { minDistance = d; closestSite = key; }
            }
            state.siteKey = closestSite;
            state.custom = minDistance < 0.3 ? null : { lat, lng };
            state.jpl = null;
            $("siteSelect").value = state.custom ? "custom" : closestSite;
            updateSimulation();
        }

        function handleSiteChange() {
            const selected = $("siteSelect").value;
            if (selected === "custom") return;
            state.siteKey = selected;
            state.custom = null;
            state.jpl = null;
            $("latInput").value = fixedSites[selected].lat;
            $("lngInput").value = fixedSites[selected].lng;
            updateSimulation();
        }

        function loadJplFile(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const payload = JSON.parse(reader.result);
                    const sampler = LS.jplSampler(payload.samples || []);
                    const start = new Date(payload.samples[0].time_utc);
                    const end = new Date(payload.samples[payload.samples.length - 1].time_utc);
                    state.jpl = { sampler, start, spanHours: (end - start) / 3600000, name: payload.site_name || "JPL site" };
                    $("latInput").value = payload.latitude_deg;
                    $("lngInput").value = payload.longitude_deg;
                    calculateCustomCoordinatesFromJpl(payload.latitude_deg, payload.longitude_deg);
                    $("epochInput").value = start.toISOString().slice(0, 16);
                    $("spanSelect").value = "24";
                    const slider = $("timeSlider");
                    slider.max = Math.max(0.5, Math.floor(state.jpl.spanHours * 2) / 2);
                    slider.value = 0;
                    updateSimulation();
                } catch (err) {
                    $("subtitleTxt").innerText = `Could not read JPL file: ${err.message}`;
                }
            };
            reader.readAsText(file);
        }

        function calculateCustomCoordinatesFromJpl(lat, lng) {
            let closestSite = "slater", minDistance = Infinity;
            for (const key in fixedSites) {
                const d = angularDistanceDeg(lat, lng, fixedSites[key].lat, fixedSites[key].lng);
                if (d < minDistance) { minDistance = d; closestSite = key; }
            }
            state.siteKey = closestSite;
            state.custom = minDistance < 0.3 ? null : { lat, lng };
            $("siteSelect").value = state.custom ? "custom" : closestSite;
        }

        function currentSite() {
            const base = fixedSites[state.siteKey];
            if (!state.custom) return { ...base, key: state.siteKey, hasTerrain: true };
            return {
                key: "custom", name: `Custom site ${state.custom.lat.toFixed(2)}°, ${state.custom.lng.toFixed(2)}°E`,
                lat: state.custom.lat, lng: state.custom.lng, img: base.img, horizon: FLAT_HORIZON, hasTerrain: false,
            };
        }

        function epochDate() {
            const v = $("epochInput").value;
            const d = v ? new Date(`${v}:00Z`) : new Date(Date.UTC(2027, 0, 15, 12));
            return Number.isNaN(d.getTime()) ? new Date(Date.UTC(2027, 0, 15, 12)) : d;
        }

        /* ---------- Core: friend's formulas drive every HUD element ---------- */
        function updateSimulation() {
            const site = currentSite();
            const hours = parseFloat($("timeSlider").value);
            const start = state.jpl ? state.jpl.start : epochDate();
            const now = new Date(start.getTime() + hours * 3600000);
            const sampleAt = state.jpl ? state.jpl.sampler : (d) => LS.modelSample(site.lat, site.lng, d);
            const profile = LS.DSN_PROFILES[profileSelect.value];

            const s = sampleAt(now);
            const sunHorizon = site.horizon(s.sunAzimuthDeg);
            const earthHorizon = site.horizon(s.earthAzimuthDeg);
            const rangeKm = s.earthRangeKm || LS.MEAN_EARTH_MOON_RANGE_KM;

            const lux = LS.estimateSolarIlluminanceLux(s.sunElevationDeg, sunHorizon);
            const irradiance = LS.estimateSolarIrradianceWm2(s.sunElevationDeg, sunHorizon);
            const rf = LS.calculateRfLink(profile, s.earthElevationDeg, rangeKm, 0.0, 2.0, earthHorizon);

            const windowStart = state.jpl ? new Date(Math.min(now.getTime(), state.jpl.start.getTime() + Math.max(0, state.jpl.spanHours - 24) * 3600000)) : now;
            const win = LS.analyzeWindow(sampleAt, windowStart, site.horizon);
            const assessment = LS.preliminarySiteAssessment(win.sunlightFraction, win.earthVisibilityFraction, win.simultaneousVisibilityFraction, site.hasTerrain);

            const powerQuality = LS.clamp((rf.receivedPowerDbmIfLos - REFERENCE_SENSITIVITY_DBM) / SIGNAL_DISPLAY_RANGE_DB, 0, 1);
            const earthDiscVisible = LS.clamp((s.earthElevationDeg - earthHorizon + EARTH_ANGULAR_RADIUS_DEG) / (2 * EARTH_ANGULAR_RADIUS_DEG), 0, 1);
            const signalQuality = powerQuality * earthDiscVisible;
            const sunVisible = s.sunElevationDeg > sunHorizon;

            state.lastResult = { site, s, sunHorizon, earthHorizon, lux, irradiance, rf, win, assessment, signalQuality, sunVisible };

            const solarPct = Math.round(win.sunlightFraction * 100);
            const commsPct = Math.round(signalQuality * 100);
            $("timeTxt").innerText = `T+${hours.toFixed(1)} h · ${now.toISOString().slice(0, 16).replace("T", " ")} UTC`;
            $("solarTxt").innerText = `${solarPct}%`;
            $("solarBar").style.width = `${solarPct}%`;
            $("solarBarWrap").setAttribute("aria-valuenow", solarPct);
            $("solarDetail").innerText = `Sun el ${s.sunElevationDeg.toFixed(2)}° vs ridge ${sunHorizon.toFixed(2)}° · ${Math.round(lux).toLocaleString("en-US")} lux · ${irradiance.toFixed(1)} W/m²`;
            $("commsTxt").innerText = `${commsPct}%`;
            $("commsBar").style.width = `${commsPct}%`;
            $("commsBarWrap").setAttribute("aria-valuenow", commsPct);
            $("commsDetail").innerText = rf.lineOfSight
                ? `Pr ${rf.receivedPowerDbmIfLos.toFixed(2)} dBm · FSPL ${rf.freeSpacePathLossDb.toFixed(2)} dB · ${Math.round(rangeKm).toLocaleString("en-US")} km · Earth el ${s.earthElevationDeg.toFixed(2)}° vs ${earthHorizon.toFixed(2)}°`
                : `NO LOS — Earth el ${s.earthElevationDeg.toFixed(2)}° below ridge ${earthHorizon.toFixed(2)}° · clear-path ref ${rf.receivedPowerDbmIfLos.toFixed(2)} dBm (hypothetical)`;
            $("fracSun").innerText = `${(win.sunlightFraction * 100).toFixed(0)}%`;
            $("fracEarth").innerText = `${(win.earthVisibilityFraction * 100).toFixed(0)}%`;
            $("fracBoth").innerText = `${(win.simultaneousVisibilityFraction * 100).toFixed(0)}%`;
            $("assessLabel").innerText = assessment.label;
            $("assessNote").innerText = assessment.note;
            $("sourceTxt").innerText = state.jpl ? `SOURCE: JPL HORIZONS FILE · ${state.jpl.name}` : "SOURCE: ANALYTIC EPHEMERIS MODEL";

            panorama.style.backgroundImage = `url('${site.img}')`;
            applyLightFilters(state.lastResult);
            adjustAudioMixing(signalQuality);
            updateStatus(state.lastResult);
            renderView();
        }

        function applyLightFilters({ lux, sunVisible, s, signalQuality, earthHorizon }) {
            const earthVisible = s.earthElevationDeg > earthHorizon;
            const earthPhase = s.earthPhase ?? 0.5;
            let brightness;
            if (sunVisible) brightness = 0.35 + 0.85 * (Math.log10(1 + lux) / Math.log10(1 + LS.NORMAL_SOLAR_ILLUMINANCE_LUX));
            else brightness = earthVisible ? 0.08 + 0.14 * earthPhase : 0.03;
            const lowSun = sunVisible ? LS.clamp(1 - s.sunElevationDeg / 10, 0, 1) : 0;
            panorama.style.filter = `brightness(${brightness.toFixed(3)}) contrast(${(1.1 + 0.35 * lowSun).toFixed(2)}) saturate(${sunVisible ? 0.85 : 0.4})`;
            $("earthshineTint").style.opacity = !sunVisible && earthVisible ? (0.25 + 0.25 * earthPhase).toFixed(2) : "0";
        }

        function updateStatus(r) {
            const sub = $("subtitleTxt");
            const badge = $("statusBadge");
            const name = r.site.name;
            let message;
            if (r.assessment.label === "GEOMETRICALLY PROMISING") {
                badge.innerText = "MISSION APPROVED 🚀";
                badge.className = "inline-block px-4 py-2 rounded font-bold text-sm tracking-widest border bg-emerald-950/80 border-emerald-500 text-emerald-400";
                message = `Everything is nominal at ${name}. Sunlight ${(r.win.sunlightFraction * 100).toFixed(0)} percent of the next day, Earth in view ${(r.win.earthVisibilityFraction * 100).toFixed(0)} percent. DTE link reads ${r.rf.receivedPowerDbmIfLos.toFixed(1)} dBm.`;
            } else if (r.assessment.label === "TRADE STUDY REQUIRED") {
                badge.innerText = "CAUTION ⚠️";
                badge.className = "inline-block px-4 py-2 rounded font-bold text-sm tracking-widest border bg-amber-950/80 border-amber-500 text-amber-400";
                const issues = [];
                if (r.win.sunlightFraction < 0.7) issues.push(`sunlight only ${(r.win.sunlightFraction * 100).toFixed(0)} percent`);
                if (r.win.earthVisibilityFraction < 0.5) issues.push(`Earth visible only ${(r.win.earthVisibilityFraction * 100).toFixed(0)} percent`);
                if (r.win.simultaneousVisibilityFraction < 0.3) issues.push(`sun and Earth together only ${(r.win.simultaneousVisibilityFraction * 100).toFixed(0)} percent`);
                if (!r.site.hasTerrain) issues.push("no terrain mask for these coordinates");
                message = `Alert. Marginal telemetry at ${name}: ${issues.join(", ") || "parameters near limits"}. Review power storage limits or antenna angles.`;
            } else {
                badge.innerText = "ABORT MISSION ❌";
                badge.className = "inline-block px-4 py-2 rounded font-bold text-sm tracking-widest border bg-red-950/80 border-red-500 text-red-400 animate-pulse";
                message = r.site.key === "shackleton"
                    ? "Oops! Welcome to the bottom of Shackleton Crater. Sunlight hasn't touched this place since the dinosaurs, and a massive mountain is blocking Earth. NASA removed this from the list for a reason! Quick, choose one of the official 9 candidate sites before our astronauts freeze to death!"
                    : `Abort. ${name} is high constraint: sunlight ${(r.win.sunlightFraction * 100).toFixed(0)} percent, Earth visible ${(r.win.earthVisibilityFraction * 100).toFixed(0)} percent over the next day.`;
            }
            if (!r.rf.lineOfSight && r.assessment.label !== "HIGH CONSTRAINT") message += " Earth is behind the ridge right now — we're on static.";
            sub.innerText = message;

            const speakKey = `${r.site.key}|${r.assessment.label}|${r.rf.lineOfSight}`;
            if (speakKey !== state.lastSpokenKey) {
                state.lastSpokenKey = speakKey;
                Radio.speak(message);
            }
        }

        /* ---------- Panorama, terrain mask, Sun/Earth markers ---------- */
        function renderView() {
            const W = window.innerWidth, H = window.innerHeight, ppd = pxPerDeg();
            const horizonY = H * 0.6;
            const vScale = ppd * ELEVATION_EXAGGERATION;
            panorama.style.backgroundSize = `${360 * ppd}px 100%`;
            panorama.style.backgroundPosition = `${W / 2 - state.heading * ppd}px 0`;
            $("compassTxt").innerText = `HDG ${String(Math.round(state.heading)).padStart(3, "0")}°`;

            const r = state.lastResult;
            if (!r) return;
            const toScreen = (az, el) => ({
                x: W / 2 + LS.wrap180(az - state.heading) * ppd,
                y: LS.clamp(horizonY - el * vScale, 40, H - 40),
            });

            const points = [];
            for (let x = 0; x <= W; x += 8) {
                const az = state.heading + (x - W / 2) / ppd;
                points.push(`${x},${LS.clamp(horizonY - r.site.horizon(LS.norm360(az)) * vScale, 0, H).toFixed(1)}`);
            }
            $("terrainLine").setAttribute("points", points.join(" "));
            $("idealHorizon").setAttribute("y1", horizonY);
            $("idealHorizon").setAttribute("y2", horizonY);

            const sun = toScreen(r.s.sunAzimuthDeg, r.s.sunElevationDeg);
            const earth = toScreen(r.s.earthAzimuthDeg, r.s.earthElevationDeg);
            placeMarker("sunMarker", sun, W);
            placeMarker("earthMarker", earth, W);
            $("sunMarker").style.opacity = r.sunVisible ? "1" : "0.35";
            $("sunDisc").style.boxShadow = r.sunVisible ? "0 0 30px 12px rgba(253,230,138,0.55)" : "none";
            $("sunLabel").innerText = `SUN ${r.s.sunElevationDeg.toFixed(1)}°${r.sunVisible ? "" : " · BLOCKED"}`;
            const earthVisible = r.rf.lineOfSight;
            $("earthMarker").style.opacity = earthVisible ? "1" : "0.35";
            $("earthLabel").innerText = `EARTH ${r.s.earthElevationDeg.toFixed(1)}°${earthVisible ? "" : " · NO LOS"}`;

            const glareStrength = r.sunVisible ? LS.clamp(Math.log10(1 + r.lux) / Math.log10(1 + LS.NORMAL_SOLAR_ILLUMINANCE_LUX), 0, 1) : 0;
            const onScreen = sun.x > -200 && sun.x < W + 200;
            $("sunGlare").style.background = `radial-gradient(circle at ${sun.x}px ${sun.y}px, rgba(255,244,214,0.55), rgba(255,244,214,0.08) 25%, transparent 55%)`;
            $("sunGlare").style.opacity = onScreen ? (glareStrength * 0.9).toFixed(2) : "0";
        }

        function placeMarker(id, pos, W) {
            const el = $(id);
            el.style.left = `${pos.x}px`;
            el.style.top = `${pos.y}px`;
            el.style.display = pos.x < -60 || pos.x > W + 60 ? "none" : "block";
        }

        /* ---------- Timeline ---------- */
        function updateTimelineValues() {
            updateSimulation();
        }

        function changeSpan() {
            const slider = $("timeSlider");
            state.jpl = null;
            slider.max = $("spanSelect").value;
            if (parseFloat(slider.value) > parseFloat(slider.max)) slider.value = 0;
            updateSimulation();
        }

        let animationTimer = null;
        function toggleTimeline() {
            const btn = $("playBtn");
            const slider = $("timeSlider");
            if (animationTimer) {
                clearInterval(animationTimer);
                animationTimer = null;
                btn.innerText = "PLAY";
                btn.className = "bg-amber-500 text-black px-3 py-1 rounded text-xs font-bold";
            } else {
                btn.innerText = "PAUSE";
                btn.className = "bg-red-500 text-white px-3 py-1 rounded text-xs font-bold";
                animationTimer = setInterval(() => {
                    const step = parseFloat(slider.max) > 100 ? 6 : 0.5;
                    let nextVal = parseFloat(slider.value) + step;
                    if (nextVal > parseFloat(slider.max)) nextVal = 0;
                    slider.value = nextVal;
                    updateTimelineValues();
                }, 800);
            }
        }

        for (const site of Object.values(fixedSites)) {
            const img = new Image();
            img.onerror = () => console.warn(`Panorama missing: ${site.img}`);
            img.src = site.img;
        }
        updateSimulation();
    </script>
</body>
</html>
